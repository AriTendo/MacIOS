name: Build iOS app

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app for iOS devices
        run: |
          mkdir -p build
          set +e
          xcodebuild \
            -project JITCheck.xcodeproj \
            -scheme JITCheck \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build > build/xcodebuild.log 2>&1
          result=$?
          tail -n 100 build/xcodebuild.log
          exit "$result"

      - name: Report Xcode diagnostics
        if: failure()
        run: |
          if [ -f build/xcodebuild.log ]; then
            grep -E 'error:|fatal error:|warning:|BUILD FAILED|Error Domain=' build/xcodebuild.log | tail -n 40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 100 build/xcodebuild.log >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/JITCheck.app build/Payload/
          cd build
          /usr/bin/zip -qry JITCheck.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JITCheck-unsigned-IPA
          path: build/JITCheck.ipa
          if-no-files-found: error
          retention-days: 14
